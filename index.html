<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B2B Калькулятор | LIScorp</title>
    <style>
        :root {
            --bg-color: #0d0d12;
            --panel-bg: #15151e;
            --accent: #00ffcc;
            --accent-glow: rgba(0, 255, 204, 0.3);
            --tax-color: #ff4757;
            --cash-color: #ffaa00;
            --text-main: #e0e0e0;
            --text-muted: #888;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .calculator {
            background-color: var(--panel-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), 0 0 15px var(--accent-glow);
            width: 100%;
            max-width: 450px;
            border: 1px solid #2a2a35;
        }
        h2 {
            margin-top: 0;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--accent);
            text-align: center;
            margin-bottom: 25px;
            text-shadow: 0 0 10px var(--accent-glow);
        }
        .input-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.85em;
            color: var(--text-muted);
        }
        .label-highlight {
            color: var(--cash-color);
        }
        input {
            width: 100%;
            padding: 12px;
            background-color: #0d0d12;
            border: 1px solid #333;
            border-radius: 6px;
            color: #fff;
            font-size: 1em;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }
        input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 8px var(--accent-glow);
        }
        .results {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px dashed #333;
        }
        .result-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 0.95em;
        }
        .final-price {
            font-size: 1.2em;
            font-weight: bold;
            color: var(--accent);
            margin-bottom: 15px;
            padding: 15px;
            background: rgba(0, 255, 204, 0.05);
            border: 1px solid rgba(0, 255, 204, 0.2);
            border-radius: 8px;
            text-shadow: 0 0 8px var(--accent-glow);
        }
        .tax-info {
            color: var(--tax-color);
        }
    </style>
</head>
<body>

<div class="calculator">
    <h2>Сложный расчет КП с НДС 22%</h2>

    <div class="input-group">
        <label>1. Закуп с НДС 5%, ₽</label>
        <input type="number" id="buyVat5" oninput="calculate()" placeholder="0">
    </div>

    <div class="input-group">
        <label class="label-highlight">2. Закуп за НАЛИЧНЫЕ (без док-тов), ₽</label>
        <input type="number" id="buyCash" oninput="calculate()" placeholder="0">
    </div>

    <div class="input-group">
        <label>3. Закуп с НДС 22%, ₽</label>
        <input type="number" id="buyVat22" oninput="calculate()" placeholder="0">
    </div>

    <div class="input-group" style="margin-top: 25px;">
        <label style="color: var(--accent);">Желаемая прибыль (на счету с НДС 22%), ₽</label>
        <input type="number" id="profit" oninput="calculate()" placeholder="0">
    </div>

    <div class="results">
        <div class="result-item final-price">
            <span>Итого заказчику (с НДС 22%):</span>
            <span id="resFinalWithVat">0 ₽</span>
        </div>
        <div class="result-item">
            <span style="color: var(--text-muted);">Итоговая база (без НДС):</span>
            <span id="resFinalNoVat">0 ₽</span>
        </div>
        <div class="result-item tax-info">
            <span>НДС в бюджет:</span>
            <span id="resVatToPay">0 ₽</span>
        </div>
        <div class="result-item tax-info">
            <span>Налог на прибыль (25%):</span>
            <span id="resIncomeTax">0 ₽</span>
        </div>
        <div class="result-item">
            <span style="color: var(--text-muted);">Чистая рентабельность:</span>
            <span id="resMargin">0 %</span>
        </div>
    </div>
</div>

<script>
    function calculate() {
        // Получаем значения полей (если пусто, ставим 0)
        let b5 = parseFloat(document.getElementById('buyVat5').value) || 0;
        let bCash = parseFloat(document.getElementById('buyCash').value) || 0;
        let b22 = parseFloat(document.getElementById('buyVat22').value) || 0;
        let netProfit = parseFloat(document.getElementById('profit').value) || 0;

        // Вычленяем базу без НДС и сам входящий НДС для официальных закупок
        let c5 = b5 / 1.05;
        let v5 = b5 - c5; // НДС 5% к вычету

        let c22 = b22 / 1.22;
        let v22 = b22 - c22; // НДС 22% к вычету

        let cOfficial = c5 + c22; // Официальная себестоимость без НДС

        // Для налоговой "закуп за наличные" не является расходом. 
        // Поэтому, чтобы получить чистую прибыль, официальная наценка должна покрыть:
        // Саму чистую прибыль + Сумму налички + Налог на прибыль (25%) со всей этой массы.
        // Формула: Валовая прибыль = (Чистая прибыль + Наличка) / (1 - 0.25)
        let grossProfit = (netProfit + bCash) / 0.75; 

        // Итоговая база без НДС = Официальная себестоимость + Валовая прибыль
        let finalNoVat = cOfficial + grossProfit;
        
        // Итоговая цена заказчику с НДС 22%
        let finalWithVat = finalNoVat * 1.22;

        // Расчет налогов
        let outgoingVat = finalNoVat * 0.22; // Исходящий НДС
        let vatToPay = outgoingVat - v5 - v22; // НДС в бюджет (разница)
        
        let incomeTax = grossProfit * 0.25; // Налог на прибыль 25%

        // Чистая рентабельность (прибыль на руки от очищенной выручки)
        let margin = finalNoVat > 0 ? (netProfit / finalNoVat) * 100 : 0;

        // Форматирование
        const formatMoney = (num) => new Intl.NumberFormat('ru-RU').format(Math.round(num)) + ' ₽';

        // Вывод результатов
        document.getElementById('resFinalWithVat').innerText = formatMoney(finalWithVat);
        document.getElementById('resFinalNoVat').innerText = formatMoney(finalNoVat);
        document.getElementById('resVatToPay').innerText = formatMoney(vatToPay);
        document.getElementById('resIncomeTax').innerText = formatMoney(incomeTax);
        document.getElementById('resMargin').innerText = margin.toFixed(1) + ' %';
    }
</script>

</body>
</html>
