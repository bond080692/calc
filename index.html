<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIScorp | Терминал расчетов</title>
    <link href="https://fonts.googleapis.com/css2?family=Jura:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #00ffcc;
            --accent-glow: rgba(0, 255, 204, 0.4);
            --tax-color: #ff003c;  
            --cash-color: #fcee0a; 
            --text-main: #f0f0f0;
            --text-muted: #a0a0b0;
            --glass-bg: rgba(10, 10, 15, 0.75);
        }
        body {
            font-family: 'Jura', sans-serif;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            
            /* ФОН */
            background-color: #09090b;
            background-image: url('neon-gorod-budushchee-zdaniia-ulitsa-fantastika-cyber.jpg'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        /* Темный градиент поверх картинки */
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0.85) 100%);
            z-index: -1;
        }
        .calculator {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            
            padding: 35px 30px;
            border-radius: 8px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8), inset 0 0 0 1px rgba(0, 255, 204, 0.15);
            width: 100%;
            max-width: 480px;
            position: relative;
            overflow: hidden;
        }
        .calculator::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: var(--accent);
            box-shadow: 0 0 15px var(--accent);
        }
        h2 {
            margin-top: 0;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #fff;
            text-align: center;
            margin-bottom: 30px;
            text-shadow: 0 0 10px var(--accent-glow);
            font-size: 1.4em;
        }
        h2 span {
            color: var(--accent);
        }
        .input-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9em;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: var(--text-muted);
        }
        .label-highlight {
            color: var(--cash-color);
            text-shadow: 0 0 8px rgba(252, 238, 10, 0.3);
        }
        input {
            width: 100%;
            padding: 12px 15px;
            background-color: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            color: #fff;
            font-size: 1.1em;
            font-family: 'Jura', sans-serif;
            font-weight: 600;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }
        input:focus {
            outline: none;
            border-color: var(--accent);
            background-color: rgba(0, 255, 204, 0.05);
            box-shadow: 0 0 12px var(--accent-glow);
        }
        
        /* === УБИРАЕМ СТРЕЛКИ В ПОЛЯХ ВВОДА === */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
        /* ===================================== */

        .results {
            margin-top: 30px;
            padding-top: 25px;
            border-top: 1px dashed rgba(255, 255, 255, 0.15);
        }
        .result-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 0.95em;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .final-price {
            font-size: 1.3em;
            color: var(--accent);
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(0, 255, 204, 0.08);
            border: 1px solid rgba(0, 255, 204, 0.3);
            border-radius: 4px;
            text-shadow: 0 0 10px var(--accent-glow);
            box-shadow: inset 0 0 20px rgba(0, 255, 204, 0.05);
        }
        .tax-info {
            color: var(--tax-color);
        }
    </style>
</head>
<body>

<div class="calculator">
    <h2>LIScorp <span>//</span> Терминал</h2>

    <div class="input-group">
        <label>1. ЗАКУП С НДС 5%, ₽</label>
        <input type="number" id="buyVat5" oninput="calculate()" placeholder="0">
    </div>

    <div class="input-group">
        <label class="label-highlight">2. ЗАКУП ЗА НАЛИЧНЫЕ (ЛУЧШЕ ПЕРЕВЕСТИ В НДС 22%), ₽</label>
        <input type="number" id="buyCash" oninput="calculate()" placeholder="0">
    </div>

    <div class="input-group">
        <label>3. ЗАКУП С НДС 22%, ₽</label>
        <input type="number" id="buyVat22" oninput="calculate()" placeholder="0">
    </div>

    <div class="input-group" style="margin-top: 30px;">
        <label style="color: var(--accent); font-size: 1em;">ЖЕЛАЕМАЯ ПРИБЫЛЬ (НА СЧЕТ С НДС 22%), ₽</label>
        <input type="number" id="profit" oninput="calculate()" placeholder="0">
    </div>

    <div class="results">
        <div class="result-item final-price">
            <span>ИТОГО КЛИЕНТУ (С НДС 22%):</span>
            <span id="resFinalWithVat">0 ₽</span>
        </div>
        <div class="result-item">
            <span style="color: var(--text-muted);">Итоговая база (без НДС):</span>
            <span id="resFinalNoVat">0 ₽</span>
        </div>
        <div class="result-item tax-info">
            <span>НДС в бюджет (22%):</span>
            <span id="resVatToPay">0 ₽</span>
        </div>
        <div class="result-item tax-info">
            <span>Налог на прибыль (25%):</span>
            <span id="resIncomeTax">0 ₽</span>
        </div>
        <div class="result-item" style="margin-top: 15px; padding-top: 15px; border-top: 1px solid rgba(255, 255, 255, 0.1);">
            <span style="color: var(--text-muted);">Чистая рентабельность:</span>
            <span id="resMargin">0 %</span>
        </div>
    </div>
</div>

<script>
    function calculate() {
        let b5 = parseFloat(document.getElementById('buyVat5').value) || 0;
        let bCash = parseFloat(document.getElementById('buyCash').value) || 0;
        let b22 = parseFloat(document.getElementById('buyVat22').value) || 0;
        let netProfit = parseFloat(document.getElementById('profit').value) || 0; // Прибыль чистыми на руки

        // Входящий НДС и официальная база
        let c5 = b5 / 1.05;
        let v5 = b5 - c5; 

        let c22 = b22 / 1.22;
        let v22 = b22 - c22; 

        let cOfficial = c5 + c22; 
        
        // Старая математика: Валовая прибыль покрывает и чистую прибыль, и наличку, и 25% налога на всё это
        let grossProfit = (netProfit + bCash) / 0.75; 
        
        let finalNoVat = cOfficial + grossProfit;
        let finalWithVat = finalNoVat * 1.22;

        let outgoingVat = finalNoVat * 0.22; 
        let vatToPay = outgoingVat - v5 - v22; 
        let incomeTax = grossProfit * 0.25; 

        // Рентабельность считается от желаемой чистой прибыли к итоговой базе
        let margin = finalNoVat > 0 ? (netProfit / finalNoVat) * 100 : 0;

        const formatMoney = (num) => new Intl.NumberFormat('ru-RU').format(Math.round(num)) + ' ₽';

        document.getElementById('resFinalWithVat').innerText = formatMoney(finalWithVat);
        document.getElementById('resFinalNoVat').innerText = formatMoney(finalNoVat);
        document.getElementById('resVatToPay').innerText = formatMoney(vatToPay);
        document.getElementById('resIncomeTax').innerText = formatMoney(incomeTax);
        document.getElementById('resMargin').innerText = margin.toFixed(1) + ' %';
    }
</script>

</body>
</html>
